spring:
  config:
    activate:
      on-profile: dev
  data:
    mongodb:
      auto-index-creation: true
  mongodb:
    uri: ${MONGO_URI}
    database: privatenotes
  mail:
    host: smtp.gmail.com
    port: 465
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
  output:
    ansi:
      enabled: ALWAYS
logging:
  level:
    root: INFO
    com.luispiquinrey.backend: DEBUG
    org.springframework.data.mongodb.core.MongoTemplate: DEBUG
    org.springframework.web: DEBUG
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-components: always
      show-details: always
    info:
      access: read-only
  tracing:
    sampling:
      probability: 1.0
  observations:
    annotations:
      enabled: true
  opentelemetry:
    resource-attributes:
      service.name: ghost-notes-backend
      service.namespace: messafy
      service.version: ${OTEL_SERVICE_VERSION:1.0.0}
      deployment.environment.name: development
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
    logging:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:http://localhost:4318/v1/logs}
  otlp:
    metrics:
      export:
        url: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
