spring:
  config:
    import: optional:file:./.env[.properties]
    activate:
      on-profile: dev
  mongodb:
    uri: ${MONGO_URI}
  mail:
    host: smtp.gmail.com
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_PASSWORD}
  output:
    ansi:
      enabled: ALWAYS
logging:
  level:
    root: INFO
    com.luispiquinrey.backend: DEBUG
app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-components: always
      show-details: always
    info:
      access: read-only
  tracing:
    sampling:
      probability: 1.0
  observations:
    annotations:
      enabled: true
  opentelemetry:
    resource-attributes:
      service.name: messafy-backend
      service.namespace: messafy
      service.version: ${OTEL_SERVICE_VERSION:1.0.0}
      deployment.environment.name: development
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
    logging:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:http://localhost:4318/v1/logs}
  otlp:
    metrics:
      export:
        url: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
