spring:
  config:
    activate:
      on-profile: dev
  data:
    mongodb:
      auto-index-creation: true
  mongodb:
    uri: ${MONGO_URI}
    database: privatenotes
  mail:
    host: smtp.gmail.com
    port: 465
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
  output:
    ansi:
      enabled: ALWAYS
logging:
  level:
    root: INFO
    com.luispiquinrey.backend: DEBUG
    org.springframework.data.mongodb.core.MongoTemplate: DEBUG
    org.springframework.web: DEBUG
