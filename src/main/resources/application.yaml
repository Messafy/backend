spring:
  config:
    import: optional:classpath:.env[.properties]
  main:
    log-startup-info: true
  application:
    name: backend
  data:
    mongodb:
      auto-index-creation: true
  mongodb:
    database: privatenotes
  output:
    ansi:
      enabled: ALWAYS
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
app:
  frontend-url: http://localhost:5173
server:
  port: 8080
security:
  jwt:
    secret: ${JWT_SECRET:9f3c6e2a7b4d8f1c5a0e9d3b7c6f2a1e8d4b9c0f7a5e3d2c1b6f8a4e9d7c2b5}
logging:
  level:
    org.springframework.data.mongodb.core.MongoTemplate: DEBUG
    org.springframework.web: DEBUG
