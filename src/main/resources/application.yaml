spring:
  main:
    log-startup-info: true
  application:
    name: backend
  data:
    mongodb:
      auto-index-creation: true
  mongodb:
    database: privatenotes
  output:
    ansi:
      enabled: DETECT
  mvc:
    log-request-details: false
  mail:
    port: 465
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          ssl:
            enable: true
          starttls:
            enable: false
app:
  frontend-url: ${APP_FRONTEND_URL}
  public-base-url: ${APP_PUBLIC_BASE_URL}
server:
  port: 8080
security:
  jwt:
    secret: ${JWT_SECRET}
logging:
  level:
    root: INFO
    com.luispiquinrey.backend: INFO
    org.springframework.data.mongodb.core.MongoTemplate: WARN
    org.springframework.web: WARN
