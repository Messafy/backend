spring:
  mvc:
    log-request-details: false
  config:
    activate:
      on-profile: test
  data:
    mongodb:
      auto-index-creation: false
  output:
    ansi:
      enabled: NEVER
  mongodb:
    database: test-privatenotes
logging:
  level:
    root: WARN
    com.luispiquinrey.backend: INFO

management:
  opentelemetry:
    enabled: false
  otlp:
    metrics:
      export:
        enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-components: always
      show-details: always

security:
  jwt:
    secret: test-only-signing-key-not-for-production-0123456789abcdef
  user:
    password: "{noop}${USER_TEST_PASSWORD:test}"
    username: ${USER_TEST_USERNAME:luispiquinrey}

app:
  frontend-url: http://localhost:5173
  public-base-url: http://localhost:8080

de:
  flapdoodle:
    mongodb:
      embedded:
        version: 7.0.14
