services:
  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MONGO_URI: ${MONGO_URI:?Set MONGO_URI}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:?Set APP_FRONTEND_URL}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:?Set APP_PUBLIC_BASE_URL}
      EMAIL_USERNAME: ${EMAIL_USERNAME:?Set EMAIL_USERNAME}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:?Set EMAIL_PASSWORD}
      EMAIL_FROM: ${EMAIL_FROM:?Set EMAIL_FROM}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:?Set OTEL_SERVICE_NAME}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:?Set OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:?Set OTEL_EXPORTER_OTLP_PROTOCOL}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:?Set OTEL_RESOURCE_ATTRIBUTES}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:?Set OTEL_EXPORTER_OTLP_HEADERS}
    networks: [edge]

  caddy:
    container_name: messafy-prod-caddy
    image: messafy/caddy-ratelimit:2.10.2-v0.1.0
    build:
      context: .
      dockerfile: Dockerfile.caddy
    restart: unless-stopped
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile"]
    environment:
      BACKEND_UPSTREAM: backend:8080
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge]

  tunnel:
    container_name: messafy-prod-tunnel
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:latest}
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Set the Cloudflare Tunnel token}
    depends_on:
      caddy:
        condition: service_started
    networks: [edge]

networks:
  edge:

volumes:
  caddy-data:
  caddy-config:
