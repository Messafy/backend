services:
  mongodb:
    image: mongo:7
    environment:
      MONGO_INITDB_DATABASE: privatenotes
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    image: messafy/backend:latest
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MONGO_URI: ${MONGO_URI_DOCKER}
      JWT_SECRET: ${JWT_SECRET}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL}
      EMAIL_USERNAME: ${EMAIL_USERNAME}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://grafana-otel-lgtm:4318/v1/traces
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://grafana-otel-lgtm:4318/v1/metrics
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://grafana-otel-lgtm:4318/v1/logs
      OTEL_SERVICE_NAME: ghost-notes-backend
      OTEL_SERVICE_VERSION: ${OTEL_SERVICE_VERSION:-1.0.0}
      OTEL_RESOURCE_ATTRIBUTES: service.name=ghost-notes-backend,service.namespace=messafy,service.version=${OTEL_SERVICE_VERSION:-1.0.0},deployment.environment.name=production
      OTEL_ENVIRONMENT: production
    ports:
      - "8080:8080"
    depends_on:
      mongodb:
        condition: service_healthy
      grafana-otel-lgtm:
        condition: service_healthy

  grafana-otel-lgtm:
    image: grafana/otel-lgtm:latest
    ports:
      - "4317:4317"
      - "4318:4318"
      - "3000:3000"

volumes:
  mongo-data:
