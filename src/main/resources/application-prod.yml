spring:
  config:
    activate:
      on-profile: prod
  docker:
    compose:
      enabled: false
  data:
    mongodb:
      auto-index-creation: true
  mongodb:
    uri: ${MONGO_URI}
    database: privatenotes
  mail:
    host: smtp.gmail.com
    port: 465
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
  output:
    ansi:
      enabled: NEVER
logging:
  level:
    root: WARN
    com.luispiquinrey.backend: INFO
