spring:
  config:
    activate:
      on-profile: prod
  docker:
    compose:
      enabled: false
  mongodb:
    uri: ${MONGO_URI}
  mail:
    host: smtp.gmail.com
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_PASSWORD}
  output:
    ansi:
      enabled: NEVER
logging:
  level:
    root: WARN
    com.luispiquinrey.backend: INFO
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,mongo
      show-components: never
      show-details: never
  tracing:
    sampling:
      probability: 0.1
  observations:
    annotations:
      enabled: true
