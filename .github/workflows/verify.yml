name: Verify

on:
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Build, test and analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Cache SonarQube packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: |
            ${{ runner.os }}-sonar

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Build, test and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [[ -z "$SONAR_TOKEN" ]]; then
            echo "::warning::SONAR_TOKEN is not available, so SonarQube analysis is skipped"
            ./mvnw --batch-mode clean verify
            exit 0
          fi
          ./mvnw --batch-mode clean verify \
            org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.organization=messafy \
            -Dsonar.projectKey=Messafy_backend \
            -Dsonar.qualitygate.wait=true

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 7

  caddy:
    name: Validate Caddyfile
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Resolve Caddy image
        run: |
          caddy_tag="$(sha256sum deploy/Dockerfile.caddy | cut -c1-12)"
          echo "CADDY_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-caddy:${caddy_tag}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull or build Caddy image
        run: |
          if docker pull "$CADDY_IMAGE"; then
            exit 0
          fi
          docker buildx build --load --tag "$CADDY_IMAGE" --file deploy/Dockerfile.caddy deploy

      - name: Validate Caddyfile
        run: >
          docker run --rm
          -e BACKEND_UPSTREAM=backend:8080
          -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro"
          "$CADDY_IMAGE"
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
